# Browser navigations send Accept: text/html… — serve the SPA.
# XHR/fetch (axios) prefer application/json — proxy those to the API.
map $http_accept $spa_nav {
    default         0;
    ~*text/html     1;
}

server {
    listen 3005;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # Vite hashed bundles — filename changes on rebuild, so they are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Exact match so try_files / rewrite-last SPA fallbacks keep routing to this
    # file and still get no-cache (add_header on location / would not apply after
    # the internal redirect). After docker compose rebuild, browsers revalidate
    # index.html and pick up the new hashed JS.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # OAuth redirects are full-page browser navigations (Accept: text/html).
    # They must reach the API — the generic /auth block below would serve the SPA instead.
    location ~ ^/auth/linkedin/(login|callback)(/|$) {
        proxy_pass http://linkedin-backend:8005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /auth/dev-connect {
        proxy_pass http://linkedin-backend:8005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(auth|posts|topics|performance|settings|onboarding|admin|tenant|health|uploads)(/|$) {
        if ($spa_nav) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://linkedin-backend:8005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
