# Dev overlay: hot-reload admin (and optionally web/user) without rebuild.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up admin
# Or for the full stack in dev mode for frontends:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  admin:
    build:
      context: ./client/admin
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_ADMIN_API_URL: http://localhost:8000/api/admin
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_ADMIN_API_URL: http://localhost:8000/api/admin
      DATABASE_URL: postgresql://postgres:postgres@db:5432/delegtlabs
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./client/admin:/app
      - admin_node_modules:/app/node_modules
      - admin_next:/app/.next
    command: sh -c "npm run db:generate && npm run dev -- -H 0.0.0.0 -p 3000"

volumes:
  admin_node_modules:
  admin_next:
