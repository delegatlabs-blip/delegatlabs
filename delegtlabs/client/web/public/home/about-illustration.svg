<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Koshatech product engineering illustration</title>
  <desc id="desc">Abstract illustration with a device frame, charts, and floating cards in a blue gradient style.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- soft blobs -->
  <circle cx="240" cy="210" r="170" fill="#bfdbfe" opacity="0.55" filter="url(#soft)"/>
  <circle cx="1020" cy="220" r="190" fill="#a5f3fc" opacity="0.40" filter="url(#soft)"/>
  <circle cx="940" cy="720" r="220" fill="#93c5fd" opacity="0.30" filter="url(#soft)"/>

  <!-- dotted field -->
  <g opacity="0.25" fill="#94a3b8">
    <!-- simple grid of dots -->
    <circle cx="140" cy="540" r="2"/><circle cx="180" cy="540" r="2"/><circle cx="220" cy="540" r="2"/><circle cx="260" cy="540" r="2"/><circle cx="300" cy="540" r="2"/>
    <circle cx="140" cy="580" r="2"/><circle cx="180" cy="580" r="2"/><circle cx="220" cy="580" r="2"/><circle cx="260" cy="580" r="2"/><circle cx="300" cy="580" r="2"/>
    <circle cx="140" cy="620" r="2"/><circle cx="180" cy="620" r="2"/><circle cx="220" cy="620" r="2"/><circle cx="260" cy="620" r="2"/><circle cx="300" cy="620" r="2"/>
  </g>

  <!-- main device -->
  <g filter="url(#shadow)">
    <rect x="460" y="150" width="440" height="610" rx="54" fill="#0f172a"/>
    <rect x="478" y="175" width="404" height="560" rx="44" fill="#ffffff"/>
    <rect x="610" y="165" width="140" height="10" rx="5" fill="#334155" opacity="0.55"/>
  </g>

  <!-- chart bars -->
  <g transform="translate(520 250)">
    <rect x="0" y="0" width="320" height="16" rx="8" fill="#e2e8f0"/>
    <rect x="0" y="0" width="210" height="16" rx="8" fill="#bfdbfe"/>

    <rect x="0" y="46" width="320" height="16" rx="8" fill="#e2e8f0"/>
    <rect x="0" y="46" width="265" height="16" rx="8" fill="#a5f3fc"/>

    <rect x="0" y="92" width="320" height="16" rx="8" fill="#e2e8f0"/>
    <rect x="0" y="92" width="150" height="16" rx="8" fill="#93c5fd"/>

    <rect x="0" y="138" width="320" height="16" rx="8" fill="#e2e8f0"/>
    <rect x="0" y="138" width="285" height="16" rx="8" fill="url(#accent)"/>
  </g>

  <!-- floating cards -->
  <g filter="url(#shadow)">
    <rect x="210" y="230" width="300" height="190" rx="28" fill="#ffffff"/>
    <rect x="240" y="270" width="240" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="240" y="302" width="180" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="240" y="342" width="210" height="14" rx="7" fill="#bfdbfe"/>
    <rect x="240" y="370" width="160" height="14" rx="7" fill="#a5f3fc"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="820" y="560" width="270" height="190" rx="28" fill="#ffffff"/>
    <rect x="848" y="600" width="200" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="848" y="632" width="140" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="848" y="680" width="210" height="18" rx="9" fill="url(#accent)"/>
  </g>

  <!-- accent corner tag -->
  <g filter="url(#shadow)">
    <rect x="760" y="120" width="190" height="90" rx="28" fill="url(#accent)"/>
    <circle cx="910" cy="165" r="10" fill="#ffffff" opacity="0.8"/>
    <circle cx="880" cy="165" r="10" fill="#ffffff" opacity="0.55"/>
  </g>
</svg>

