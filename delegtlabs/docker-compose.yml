services:
  db:
    image: postgres:16-alpine
    container_name: delegtlabs-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: delegtlabs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d delegtlabs"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: delegtlabs-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: DelegtLabs
      APP_ENV: docker
      APP_VERSION: 0.1.0
      API_VERSION: v1
      DEBUG: "true"
      HOST: 0.0.0.0
      PORT: 8000
      CORS_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/delegtlabs
      SECRET_KEY: docker-dev-secret
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      SUPABASE_JWKS_URL: https://project-id.supabase.co/auth/v1/.well-known/jwks.json
      SUPABASE_JWT_ISSUER: https://project-id.supabase.co/auth/v1
      SUPABASE_JWT_AUDIENCE: authenticated
      ADMIN_REQUIRED_ROLE: ops_admin
      DISABLE_ADMIN_AUTH: "true"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 12

  admin:
    build:
      context: ./client/admin
      dockerfile: Dockerfile
    container_name: delegtlabs-admin
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
