services:
  db:
    image: postgres:16-alpine
    container_name: delegtlabs-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: delegtlabs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # 5433 on host avoids clash with local Mac Postgres on 5432
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d delegtlabs"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: delegtlabs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: delegtlabs-server:local
    container_name: delegtlabs-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: DelegtLabs
      APP_ENV: docker
      APP_VERSION: 0.1.0
      API_VERSION: v1
      DEBUG: "true"
      HOST: 0.0.0.0
      PORT: 8000
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002
      # Compose Postgres service (admin agents/users/customers CRUD)
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/delegtlabs
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: docker-dev-secret
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ADMIN_REQUIRED_ROLE: ops_admin
      DISABLE_ADMIN_AUTH: "true"
      DISABLE_USER_AUTH: "true"
      AGENTS_DIR: /app/packages/agents
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    image: delegtlabs-server:local
    container_name: delegtlabs-worker
    # One-shot agent cycle on start; re-run with: docker compose run --rm worker
    restart: on-failure
    command: python worker_main.py
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      server:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/delegtlabs
      REDIS_URL: redis://redis:6379/0
      AGENTS_DIR: /app/packages/agents

  admin:
    build:
      context: ./client/admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ADMIN_API_URL: http://localhost:8000/api/admin
    container_name: delegtlabs-admin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgres@db:5432/delegtlabs
    ports:
      - "3000:3000"

  web:
    build:
      context: ./client/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WEB_API_URL: http://localhost:8000/web/api/v1
    container_name: delegtlabs-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    environment:
      PORT: 3001
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/delegtlabs
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "3001:3001"

  user:
    build:
      context: ./client/user
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_USER_API_URL: http://localhost:8000/user/api/v1
        NEXT_PUBLIC_DISABLE_USER_AUTH: "true"
    container_name: delegtlabs-user
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    environment:
      PORT: 3002
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgres@db:5432/delegtlabs
    ports:
      - "3002:3002"

volumes:
  postgres_data:
